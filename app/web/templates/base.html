<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}NixSec Procurement Intelligence{% endblock %}</title><link rel="stylesheet" href="/static/app.css"></head><body><div class="shell"><aside class="side"><div class="brand">NI<span>X</span>SEC</div><nav>{% for url,label in [('/', 'Dashboard'),('/prospects','Prospects'),('/clients','Clients'),('/tenders','Live Tenders'),('/contracts','Contracts'),('/reports','Reports'),('/data-collection','Data Collection')] %}<a href="{{url}}" class="{{'active' if path==url else ''}}">{{label}}</a>{% endfor %}</nav></aside><main class="main"><div class="top"><form class="search" action="/search"><input name="q" placeholder="Search tenders, contracts, suppliers, agencies…"><button>Search</button></form><form method="post" action="/logout"><button class="secondary">Log out</button></form></div>{% block content %}{% endblock %}</main></div></body></html>
